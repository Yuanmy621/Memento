allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  # Electron Forge 的 DMG maker（appdmg）用它们读扩展属性 / 写 Finder 别名。
  # 只是为了 `npm run make` 能出 .dmg；不想装就把 maker-dmg 从 forge.config.js 里去掉。
  fs-xattr: true
  macos-alias: true
  # 渲染进程的打包器：postinstall 负责放置平台二进制。
  esbuild: true
  koffi: true
  node-pty: true

# 外部 MCP 客户端插件（@deepseek-ai/dsh-mcp-client@0.0.1-rc.1）声明的是 0.0.1-rc.1 那条
# 版本线的 peer，但它真实用到的 API（`ctx.tools` 注册工具 + `scrubbedParentEnv`）
# 在 0.1.5-rc.2 上完全成立 —— 而 0.1.5-rc.2 才是本仓库另外 40 个 dsh 包的版本。
#
# 所以这里把 peer 对齐到实际安装的版本，**不**为了它引入过期依赖线：
# 试过装 @deepseek-ai/dsh-subprocess@0.0.1-rc.1，结果它被链接进
# dsh-subprocess-local 的解析路径，而后者要的是 0.1.5-rc.2 的 SubprocessRuntime，
# 直接把内核打崩（`does not provide an export named 'SubprocessRuntime'`）。
peerDependencyRules:
  allowedVersions:
    '@deepseek-ai/dsh-invariants': '0.1.5-rc.2'
    '@deepseek-ai/dsh-llm': '0.1.5-rc.2'
    '@deepseek-ai/dsh-subprocess': '0.1.5-rc.2'
    '@deepseek-ai/dsh-tools': '0.1.5-rc.2'
    '@deepseek-ai/cordis': '4.0.2'

# Electron Forge 的 @electron/rebuild@3.x 把 `@electron/node-gyp` 写成了 git 依赖
# （`git+https://github.com/electron/node-gyp.git#06b29aa…`），而 pnpm 12 默认开启的
# blockExoticSubdeps 拒绝安装「子依赖里的 git 依赖」。
#
# Electron 官方把同一个包发布到了 registry，所以这里用 override 指回 registry ——
# **不关掉** blockExoticSubdeps 那道供应链闸门（关掉它会影响整个仓库的依赖解析）。
# 这个包只在打包时被 @electron/rebuild 用到，且我们并不重建原生模块（见 forge.config.js
# 里的 rebuildConfig），版本差异不影响产物。
overrides:
  '@electron/node-gyp': '10.2.0-electron.2'
